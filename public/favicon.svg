<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- TAAM favicon: white wordmark centered on #002664 square -->
  <rect width="32" height="32" rx="4" fill="#002664"/>
  <!-- Scale the 520×100 TAAM wordmark to fit inside the 32×32 icon -->
  <!-- Target area: 28×5.4 inside the 32×32 (centered, with 2px margins) -->
  <!-- scale = 28/520 ≈ 0.0538, height = 100*0.0538 ≈ 5.38 -->
  <!-- top margin = (32-5.38)/2 ≈ 13.3 -->
  <g transform="translate(2, 13.3) scale(0.0538)">
    <!-- T -->
    <path fill="white" d="M16,0 L100,0 L100,20 L72,20 L72,100 L56,100 L56,20 L0,20 Z"/>
    <!-- A1 -->
    <path fill="white" d="M163,0 L210,100 L192,100 L163,32 L134,100 L116,100 Z"/>
    <rect fill="white" x="137" y="58" width="52" height="16"/>
