    <!-- A2 -->
    <path fill="white" d="M273,0 L320,100 L302,100 L273,32 L244,100 L226,100 Z"/>
    <rect fill="white" x="247" y="58" width="52" height="16"/>
    <path fill="#002664" d="M273,56 L296,100 L250,100 Z"/>
    <!-- M -->
    <rect fill="white" x="336" y="0" width="18" height="100"/>
    <path fill="white" d="M354,0 L374,0 L447,100 L427,100 Z"/>
    <path fill="white" d="M482,0 L502,0 L449,100 L429,100 Z"/>
    <rect fill="white" x="502" y="0" width="18" height="100"/>
