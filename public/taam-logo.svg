<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100">
  <!--
    TAAM Wordmark — clean hand-crafted vector
    ViewBox: 520×100 units
    
    Letter anatomy from brand guide:
    - T: Wide crossbar; LEFT end has diagonal notch (top-left corner cut diagonally
         making left tip pointed/angled). Right end is flat. Stem is centered.
    - A (×2): Isosceles triangle with solid top. Open-bottom: triangular cutout
              between the two legs at base. Horizontal crossbar at ~55% height.
    - M: Four strokes. Two outer vertical legs. Two inner strokes go from the TOP
         of the outer legs diagonally DOWN to a center valley at the baseline,
         meeting at a single peak between them at top.
  -->

  <!-- ===== T ===== -->
  <!-- Crossbar: left notch cuts from x=0,y=0 diagonally to x=16,y=20 -->
  <!-- Then bar goes right to x=100, then stem drops x=58..72 full height -->
  <path fill="currentColor" d="
    M 16,0
    L 100,0
    L 100,20
    L 72,20
    L 72,100
    L 56,100
    L 56,20
    L 0,20
    Z
  "/>

  <!-- ===== A (first) ===== x: 116 to 210, width=94 -->
  <!-- Main A silhouette -->
  <path fill="currentColor" d="
    M 163,0
    L 210,100
    L 192,100
    L 163,32
    L 134,100
    L 116,100
    Z
  "/>
  <!-- Crossbar solid fill: connects both legs at 58% height -->
  <rect fill="currentColor" x="137" y="58" width="52" height="16"/>
  <!-- Bottom open cutout (triangle between legs, white = punch out) -->
  <path fill="white" d="
    M 163,56
    L 186,100
    L 140,100
    Z
  "/>

  <!-- ===== A (second) ===== x: 226 to 320, width=94 -->
  <path fill="currentColor" d="
    M 273,0
    L 320,100
    L 302,100
    L 273,32
    L 244,100
    L 226,100
    Z
  "/>
  <rect fill="currentColor" x="247" y="58" width="52" height="16"/>
  <path fill="white" d="
    M 273,56
    L 296,100
    L 250,100
    Z
  "/>

  <!-- ===== M ===== x: 336 to 520, width=184 -->
  <!-- Outer left vertical leg -->
  <rect fill="currentColor" x="336" y="0" width="18" height="100"/>
  <!-- Inner left diagonal: from top-left peak (354,0) down to center valley (427,100) -->
  <path fill="currentColor" d="
    M 354,0
    L 374,0
    L 447,100
    L 427,100
    Z
  "/>
  <!-- Inner right diagonal: from top-right peak (502,0) down to center valley (429,100) -->
  <path fill="currentColor" d="
    M 482,0
    L 502,0
    L 449,100
    L 429,100
    Z
  "/>
  <!-- Outer right vertical leg -->
  <rect fill="currentColor" x="502" y="0" width="18" height="100"/>
</svg>
